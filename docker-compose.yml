services:
  app:
    build: .

    platform: linux/amd64

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/mcm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    restart: on-failure:5

  mysql:
    image: mysql:8

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: mcm

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: on-failure:5

volumes:
  mysql-data: