server:
  forward-headers-strategy: framework

app:
  public-base-url: ${PUBLIC_BASE_URL:}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

recommendation:
  python:
    base-url: ${RECOMMENDATION_PYTHON_BASE_URL:http://localhost:8000}
    connect-timeout: ${RECOMMENDATION_PYTHON_CONNECT_TIMEOUT:2s}
    read-timeout: ${RECOMMENDATION_PYTHON_READ_TIMEOUT:5s}
    image-connect-timeout: ${RECOMMENDATION_PYTHON_IMAGE_CONNECT_TIMEOUT:5s}
    image-read-timeout: ${RECOMMENDATION_PYTHON_IMAGE_READ_TIMEOUT:60s}
    evaluation-read-timeout: ${RECOMMENDATION_PYTHON_EVALUATION_READ_TIMEOUT:60s}

flux:
  api-key: ${BFL_API_KEY:}
  base-url: ${BFL_BASE_URL:https://api.bfl.ai}
  model-path: ${BFL_MODEL_PATH:/v1/flux-2-pro-preview}
  connect-timeout: ${BFL_CONNECT_TIMEOUT:5s}
  read-timeout: ${BFL_READ_TIMEOUT:30s}
  polling-interval: ${BFL_POLLING_INTERVAL:500ms}
  max-polling-duration: ${BFL_MAX_POLLING_DURATION:2m}
  generated-image-directory: ${AVATAR_IMAGE_STORAGE_DIR:/app/images/generated}
