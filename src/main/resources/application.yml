spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

recommendation:
  python:
    base-url: ${RECOMMENDATION_PYTHON_BASE_URL:http://localhost:8000}
    connect-timeout: ${RECOMMENDATION_PYTHON_CONNECT_TIMEOUT:2s}
    read-timeout: ${RECOMMENDATION_PYTHON_READ_TIMEOUT:5s}

style-analysis:
  python:
    base-url: ${STYLE_ANALYSIS_PYTHON_BASE_URL:http://localhost:8000}
